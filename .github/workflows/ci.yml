name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET (8, 9, 10, 11)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore RetroAchievementsSharp.sln

      - name: Build
        run: dotnet build RetroAchievementsSharp.sln -c Release --no-restore

      - name: Test
        run: dotnet test RetroAchievementsSharp.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"

  package:
    name: NuGet package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Pack
        run: dotnet pack RetroAchievementsSharp/RetroAchievementsSharp.csproj -c Release -o artifacts/nuget

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
          if-no-files-found: error
          retention-days: 14
